<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JEXORA SOLUTIONS Forms</title>
  </head>
  <body>
    <form name="consultation" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="consultation" />
      <input type="text" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="text" name="companyName" />
      <input type="url" name="websiteUrl" />
      <input type="text" name="country" />
      <input type="text" name="serviceRequired" />
      <input type="text" name="monthlyBudget" />
      <textarea name="projectDetails"></textarea>
      <input type="text" name="privacyConsent" />
    </form>
  </body>
</html>
